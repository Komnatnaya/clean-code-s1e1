<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8">
    <title>Todo App</title>
    <link 
      href="https://fonts.googleapis.com/css?family=Lato:300,400,700" 
      rel="stylesheet"
    >
    <link 
      rel="stylesheet" 
      href="styles/style.css" 
      media="screen"
    >
  </head>

  <body 
    class="page"
  >
    <header 
      class="header container"
    >
      <img 
        class="header__image"
        src="./images/eisenhower-matrix.jpg"
        alt="The Eisenhower matrix. How to make decisions on what's urgent & important."
      >
      <a 
        class="header__info" 
        href="https://goal-life.com/page/method/matrix-eisenhower"
      >
        Want more details?
      </a>
    </header>

    <main>
      <div 
        class="container"
      >
        <section class="task">
          <div 
            class="task__wrapper"
          >
            <h1
              class="task__title"
            >
              <label 
                class="task__title-label" 
                for="new-task"
              >
                Add Item
              </label>
            </h1>
            <div 
              class="task__row"
            >
              <input 
                id="new-task" 
                class="task__control task__control_new" 
                type="text"
              >
              <button 
                class="task__button"
                id="add-task"
              >
                Add
              </button>
            </div>
          </div>
        </section>

        <section class="task">
          <h2
            class="task__title"
          >
            Todo
          </h2>
          <ul 
            class="task__list task__list_incompleted"
            id="incomplete-tasks"
          >
            <li 
              class="task__list-item"
            >
              <input 
                class="task__checkbox"
                type="checkbox"
              >
              <label 
                class="task__label"
              >
                Pay Bills
              </label>
              <input 
                type="text" 
                class="task__control"
              >
              <button 
                class="task__button task__button_edit"
              >
                Edit
              </button>
              <button 
                class="task__button task__button_delete"
              >
                <img 
                  class="task__button-icon"
                  src="./images/remove.svg"
                  alt="Delete."
                >
              </button>
            </li>
            <li 
              class="task__list-item task__list-item_edit-mode"
            >
              <input 
                class="task__checkbox"
                type="checkbox"
              >
              <label 
                class="task__label"
              >
                Go Shopping
              </label>
              <input 
                type="text" 
                value="Go Shopping" 
                class="task__control"
              >
              <button 
                class="task__button task__button_edit"
              >
                Save
              </button>
              <button 
                class="task__button task__button_delete"
              >
                <img 
                  class="task__button-icon"
                  src="./images/remove.svg"
                  alt="Delete."
                >
              </button>
            </li>
          </ul>
        </section>

        <section class="task">
          <h2 
            class="task__title"
          >
            Completed
          </h2>
          <ul 
            class="task__list task__list_completed"
            id="completed-tasks"
          >
            <li class="task__list-item">
              <input 
                class="task__checkbox"
                type="checkbox" 
                checked
              >
              <label 
                class="task__label"
              >
                See the Doctor
              </label>
              <input 
                type="text" 
                class="task__control"
              >
              <button 
                class="task__button task__button_edit"
              >
                Edit
              </button>
              <button 
                class="task__button task__button_delete"
              >
                <img 
                  class="task__button-icon"
                  src="./images/remove.svg"
                  alt="Delete."
                >
              </button>
            </li>
          </ul>
        </section>

      </div>
    </main>

    <script 
      src="scripts/app.js"
    >
    </script>

  </body>
</html>
