<!DOCTYPE html>
<html lang="en">
  <head>
    <title>Todo App</title>
    <link 
      href="https://fonts.googleapis.com/css?family=Lato:300,400,700" 
      rel="stylesheet"
    >
    <link 
      rel="stylesheet" 
      href="style.css" 
      media="screen" 
      charset="utf-8"
    >
  </head>

  <body 
    class="page"
  >
    <header 
      class="header container"
    >
      <img 
        class="header-image"
        src="./eisenhower-matrix.jpg"
        alt="The Eisenhower matrix. How to make decisions on what's urgent & important."
      >
      <a 
        class="header-info" 
        href="https://goal-life.com/page/method/matrix-eisenhower"
      >
        Want more details?
      </a>
    </header>

    <div 
      class="container"
    >
      <section class="task">
        <div 
          class="task-wrapper"
        >
          <label 
            class="task-title"
            for="new-task"
          >
            Add Item
          </label>
          <div 
            class="task-row"
          >
            <input 
              id="new-task" 
              class="task-control task-control-new" 
              type="text"
            >
            <button 
              class="task-button"
            >
              Add
            </button>
          </div>
        </div>
      </section>

      <section class="task">
        <h2
          class="task-title"
        >
          Todo
        </h2>
        <ul 
          class="task-list task-list-incompleted"
          id="incomplete-tasks"
        >
          <li 
            class="task-list-item"
          >
            <input 
              class="task-checkbox"
              type="checkbox"
            >
            <label 
              class="task-label"
            >
              Pay Bills
            </label>
            <input 
              type="text" 
              class="task-control"
            >
            <button 
              class="task-button-edit task-button"
            >
              Edit
            </button>
            <button 
              class="task-button-delete task-button"
            >
              <img 
                class="task-button-icon"
                src="./remove.svg"
                alt="Delete."
              >
            </button>
          </li>
          <li 
            class="task-list-item task-list-item-edit-mode"
          >
            <input 
              class="task-checkbox"
              type="checkbox"
            >
            <label 
              class="task-label"
            >
              Go Shopping
            </label>
            <input 
              type="text" 
              value="Go Shopping" 
              class="task-control"
            >
            <button 
              class="task-button-edit task-button"
            >
              Save
            </button>
            <button 
              class="task-button-delete task-button"
            >
              <img 
                class="task-button-icon"
                src="./remove.svg"
                alt="Delete."
              >
            </button>
          </li>
        </ul>
      </section>

      <section class="task">
        <h2 
          class="task-title"
        >
          Completed
        </h2>
        <ul 
          class="task-list task-list-completed"
          id="completed-tasks"
        >
          <li class="task-list-item">
            <input 
              class="task-checkbox"
              type="checkbox" 
              checked
            >
            <label 
              class="task-label"
            >
              See the Doctor
            </label>
            <input 
              type="text" 
              class="task-control"
            >
            <button 
              class="task-button-edit task-button"
            >
              Edit
            </button>
            <button 
              class="task-button-delete task-button"
            >
              <img 
                class="task-button-icon"
                src="./remove.svg"
                alt="Delete."
              >
            </button>
          </li>
        </ul>
      </section>

    </div>

    <script 
      src="app.js"
    >
    </script>

  </body>
</html>
