<!DOCTYPE html>
<html lang="en">
  <head>
    <title>Todo App</title>
    <link 
      href="https://fonts.googleapis.com/css?family=Lato:300,400,700" 
      rel="stylesheet"
    >
    <link 
      rel="stylesheet" 
      href="style.css" 
      media="screen" 
      charset="utf-8"
    >
  </head>

  <body>
    <div 
      class="header"
    >
      <img 
        src="./eisenhower-matrix.jpg"
      >
      <a 
        class="header-info" 
        href="https://goal-life.com/page/method/matrix-eisenhower"
      >
        Want more details?
      </a>
    </div>
    <div 
      class="container"
    >
      <div 
        class="task-wrapper"
        id="top-section-for-adding-element-to-list"
      >
        <label 
          class="task-title"
          for="new-task"
        >
          Add Item
        </label>
        <div 
          class="task-row"
        >
          <input 
            id="new-task" 
            class="task-control task-control-new" 
            type="text"
          >
          <button 
            class="task-button"
          >
            Add
          </button>
        </div>
      </div>
      <h3
        class="task-title"
      >
        Todo
      </h3>
      <ul 
        class="task-list task-list-incompleted"
        id="incomplete-tasks"
      >
        <li 
          class="task-list-item"
        >
          <input 
            type="checkbox"
          >
          <label 
            class="task-control"
          >
            Pay Bills
          </label>
          <input 
            type="text" 
            class="task-control"
          >
          <button 
            class="edit"
          >
            Edit
          </button>
          <button 
            class="delete"
          >
            <img 
              src="./remove.svg"
            >
          </button>
        </li>
        <li 
          class="task-list-item task-list-item-edit-mode"
        >
          <input 
            type="checkbox"
          >
          <label 
            class="task-control"
          >
            Go Shopping
          </label>
          <input 
            type="text" 
            value="Go Shopping" 
            class="task-control"
          >
          <button 
            class="edit"
          >
            Save
          </button>
          <button 
            class="delete"
          >
            <img 
              src="./remove.svg"
            >
          </button>
        </li>
      </ul>
      <h3 
        class="task-title"
      >
        Completed
      </h3>
      <ul 
        class="task-list task-list-completed"
        id="completed-tasks"
      >
        <li>
          <input 
            type="checkbox" 
            checked
          >
          <label 
            class="task-control"
          >
            See the Doctor
          </label>
          <input 
            type="text" 
            class="task-control"
          >
          <button 
            class="edit"
          >
            Edit
          </button>
          <button 
            class="delete"
          >
            <img 
              src="./remove.svg"
            >
          </button>
        </li>
      </ul>
    </div>

    <script 
      src="app.js"
    >
    </script>

  </body>
</html>
